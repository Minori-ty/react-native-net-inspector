name: Publish to npm
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Pushed tag 'v$TAG' does not match package.json version '$PKG_VERSION'."
            exit 1
          fi
          echo "Tag v$TAG matches package.json version $PKG_VERSION."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          # 修复1：把 node-auth-token → token
          token: ${{ secrets.NPM_TOKEN }}
          # 修复2：加上scope！scope包必须配置
          scope: '@minority'
          always-auth: true

      - name: Install library dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
